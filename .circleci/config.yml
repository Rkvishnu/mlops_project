version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: pip install -r requirements.txt
      - run: python mlops_model.py
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: pip install -r requirements.txt
      - run: python test_model.py

  deploy:
    environment:
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      CIRCLECI_SSH_KEY: $CIRCLECI_SSH_KEY
    docker:
    - image: cimg/base:2023.04

    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/setup:
          region: us-east-1

      - run:
          name: Build Docker image
          command: docker build -t mlops_project .

      - run:
          name: Push Docker image to Docker Hub
          command: |
            docker tag mlops_project $DOCKERHUB_USERNAME/mlops_project:latest
            docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
            docker push $DOCKERHUB_USERNAME/mlops_project:latest

        # Install SSH Client
      - run:
          name: Install SSH Client
          command: sudo apt-get update && sudo apt-get install openssh-client

      # Connect to EC2 Instance
      - run:
          name: Connect to EC2 Instance
          command: ssh -i ~/.ssh/circleci_ssh_key circleci@43.204.141.230

      # Install Docker on EC2 Instance
      - run:
          name: Install Docker on EC2 Instance
          command: sudo apt-get update && sudo apt-get install docker.io

      # Pull Docker Image from Docker Hub
      - run:
          name: Pull Docker Image from Docker Hub
          command: docker pull $DOCKERHUB_USERNAME/mlops_project:latest

      # Run Docker Container
      - run:
          name: Run Docker Container
          command: docker run -d -p 8080:8080 $DOCKERHUB_USERNAME/mlops_project:latest

workflows:
  version: 2
  build_test_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main 
