version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.1
  
jobs:
  build:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
           name: Install Dependencies
           command: pip install -r requirements.txt
      - run: python mlops_model.py  
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
           name: Install Dependencies
           command: pip install -r requirements.txt
      - run: python test_model.py 

 deploy:
   docker:
    - image: amazon/aws-cli:2.6.4

    steps:
      - checkout
      - aws-cli/setup:
          region: us-east-1

      - run:
          name: Build Docker image
          command: docker build -t mlops_project .

      - run:
          name: Push Docker image to Docker Hub
          command: |
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker tag mlops_project $DOCKERHUB_USERNAME/mlops_project:latest
            docker push $DOCKERHUB_USERNAME/mlops_project:latest

      - run:
          name: Deploy Docker image to EC2 instance
          command: |
            docker run -d -p 8080:8080 $DOCKERHUB_USERNAME/mlops_project:latest


workflows:
  version: 2
  build_test_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main 
