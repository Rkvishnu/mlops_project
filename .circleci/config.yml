version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
           name: Install Dependencies
           command: pip install -r requirements.txt
      - run: python mlops_model.py  
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
           name: Install Dependencies
           command: pip install -r requirements.txt
      - run: python test_model.py 

  deploy:
    docker:
      - image: cimg/python:3.10
    steps:
      - run: echo "Deploying to production server"

workflows:
  version: 2
  build_test_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main 
